name: the_city_property
description: The City Property — Premium Property Management System
publish_to: 'none'
version: 1.0.2+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & state
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

  # UI
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  image: 4.5.4
  archive: 4.0.8
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - env.dev
    - env.prod
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

# ==========================================
# إعدادات توليد أيقونات التطبيق
# ==========================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true