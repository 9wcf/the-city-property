<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="The City Property — منصة عالمية لإدارة الأملاك والمجمعات والعمارات والشقق والإيجارات.">
  <meta name="theme-color" content="#050E1C">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The City Property">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>The City Property — إدارة عقارات بمعايير عالمية</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050E1C;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 12% 0%, rgba(91, 46, 134, .55), transparent 55%),
        radial-gradient(110% 90% at 92% 100%, rgba(56, 20, 81, .75), transparent 60%),
        linear-gradient(135deg, #0A051B 0%, #050E1C 55%, #100722 100%);
      font-family: "Tajawal", "Segoe UI", system-ui, -apple-system, sans-serif;
      transition: opacity .55s ease, visibility .55s ease;
    }

    #boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #boot-splash::before {
      content: "";
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(closest-side, rgba(163, 127, 177, .16), transparent 70%);
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.9); opacity: .6; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .stage {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(163, 127, 177, .3);
      animation: pulse 3.6s ease-out infinite;
    }

    .ring:nth-child(2) { animation-delay: 1.2s; }
    .ring:nth-child(3) { animation-delay: 2.4s; }

    @keyframes pulse {
      0% { transform: scale(.62); opacity: .45; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .orbit {
      position: absolute;
      width: 292px;
      height: 292px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 18%, rgba(197, 160, 89, .55) 42%, rgba(163, 127, 177, .6) 55%, transparent 72% 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.6px), #000 calc(100% - 1.4px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 1.6px), #000 calc(100% - 1.4px));
      animation: spin 12s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .glass {
      position: relative;
      padding: 16px;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .03));
      border: 1px solid rgba(255, 255, 255, .16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 34px 80px -24px rgba(0, 0, 0, .75),
        0 0 90px -18px rgba(91, 46, 134, .85),
        inset 0 1px 0 rgba(255, 255, 255, .18);
      overflow: hidden;
      animation: floaty 5.5s ease-in-out infinite;
    }

    .glass img {
      display: block;
      width: 208px;
      height: auto;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .45));
    }

    .glass::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -80%;
      width: 55%;
      height: 220%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent);
      transform: rotate(18deg);
      animation: sweep 4.4s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { left: -80%; }
      55% { left: 130%; }
      100% { left: 130%; }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .wordmark {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #F4F7FB;
      background: linear-gradient(180deg, #FFFFFF 20%, #E8DEF2 55%, #A37FB1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rise .9s ease-out both;
    }

    .divider {
      width: 110px;
      height: 1.6px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #C5A059, transparent);
      animation: rise .9s .12s ease-out both;
    }

    .tagline {
      margin: 0;
      font-size: 13.5px;
      letter-spacing: .4px;
      color: #A8B8CE;
      animation: rise .9s .2s ease-out both;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .045);
      color: rgba(168, 184, 206, .9);
      font-size: 10.5px;
      letter-spacing: .3px;
      animation: rise .9s .3s ease-out both;
    }

    .chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #C5A059;
      box-shadow: 0 0 10px rgba(197, 160, 89, .9);
      animation: blink 2.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }

    .bar {
      width: 190px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden;
      animation: rise .9s .36s ease-out both;
    }

    .bar span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #C5A059, transparent);
      animation: slide 1.6s ease-in-out infinite;
    }

    @keyframes slide {
      0% { margin-left: -45%; }
      100% { margin-left: 105%; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      .stage { width: 250px; height: 250px; }
      .ring { width: 236px; height: 236px; }
      .orbit { width: 246px; height: 246px; }
      .glass img { width: 172px; }
      .wordmark { font-size: 19px; letter-spacing: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring, .orbit, .glass, .glass::after, .bar span, #boot-splash::before { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" aria-label="The City Property">
    <div class="stage">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orbit"></div>
      <div class="glass">
        <img src="branding/logo.png" alt="The City Property">
      </div>
    </div>
    <h1 class="wordmark">THE CITY PROPERTY</h1>
    <div class="divider"></div>
    <p class="tagline">إدارة عقارات بمعايير عالمية</p>
    <div class="chip"><span class="dot"></span> منصة عالمية لإدارة الأملاك</div>
    <div class="bar"><span></span></div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      function hide() {
        if (!splash) return;
        splash.classList.add('is-hidden');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 700);
      }
      window.addEventListener('flutter-first-frame', hide);
      // Safety: never trap the visitor on the boot screen if the engine reports ready late.
      setTimeout(hide, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
